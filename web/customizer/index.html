<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AN Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: AN Maker. A bright studio stage fills the left; the maker board sits on the right: a rail of category
   buttons, pill sub-tabs, then a grid of picture tiles that are live renders of the avatar itself. Stacks on phones. */
:root {
  --bg: #e6edf1;
  --stage-top: #f8fbfc;
  --stage-low: #dce6ec;
  --panel: #fbfdfe;
  --rail: #eef4f7;
  --tile: #e9f0f4;
  --tile-top: #ffffff;
  --ink: #1d2b34;
  --muted: #5f707b;
  --line: #d3dee5;
  --accent: #0fa3b8;
  --accent-ink: #ffffff;
  --accent-soft: #d3f0f4;
  --pick: #ff961a;
  --pick-soft: #fff0db;
  --warn: #9a5b00;
  --warn-bg: #fff2dc;
  --font-display: "M PLUS Rounded 1c", "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r-tile: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171b; --stage-top: #1c272d; --stage-low: #11191e; --panel: #162026; --rail: #121b20; --tile: #1d2a31;
    --tile-top: #25343c; --ink: #e7f0f3; --muted: #93a5af; --line: #283840; --accent: #33c4d8; --accent-ink: #08181c;
    --accent-soft: #143a41; --pick: #ffab40; --pick-soft: #3b2b14; --warn: #ffc76b; --warn-bg: #3a2c12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171b; --stage-top: #1c272d; --stage-low: #11191e; --panel: #162026; --rail: #121b20; --tile: #1d2a31;
  --tile-top: #25343c; --ink: #e7f0f3; --muted: #93a5af; --line: #283840; --accent: #33c4d8; --accent-ink: #08181c;
  --accent-soft: #143a41; --pick: #ffab40; --pick-soft: #3b2b14; --warn: #ffc76b; --warn-bg: #3a2c12;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }

/* stage */
.stage { position: relative; background: radial-gradient(130% 100% at 50% 18%, var(--stage-top), var(--stage-low)); min-height: 0; overflow: hidden; }
/* the studio backdrop is light grey in both themes, so the text over it keeps the light theme's colours */
.stage { color-scheme: light; --ink: #1d2b34; --muted: #5f707b; --panel: #fbfdfe; --line: #d3dee5; --warn: #9a5b00; --warn-bg: #fff2dc;
  --accent: #0fa3b8; --accent-ink: #ffffff; color: var(--ink); }
#view, .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage-head { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.logo { margin: 0; display: flex; align-items: center; gap: 8px; font: 800 30px/1 var(--font-display); letter-spacing: -0.01em; }
.logo b { background: var(--accent); color: var(--accent-ink); border-radius: 13px; padding: 4px 10px 6px; font-weight: 800;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 62%, #000); }
.brand p { margin: 8px 0 0; color: var(--muted); font: 600 13px var(--font-body); max-width: 34ch; }
.status { font: 700 11px/1.35 var(--font-display); color: var(--muted); text-align: right; letter-spacing: 0.02em; }
.status b { color: var(--ink); }
.stage-foot { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; bottom: 14px;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
#tags { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.tag { font: 700 11px var(--font-display); padding: 4px 10px; border-radius: 999px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.drive-hint { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; color: var(--muted);
  font: 700 12px var(--font-display); white-space: nowrap; }
.drive-hint span { margin: 0 4px; }
kbd { font: 800 11px var(--font-display); background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-bottom-width: 3px; border-radius: 7px; padding: 2px 6px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 700 14px var(--font-display); color: var(--muted); }
@media (hover: none) { .drive-hint { display: none; } }
/* touch: a thumb joystick bottom-left of the stage and a jump button bottom-right (they replace WASD and Space) */
.joy { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; width: 112px; height: 112px; border-radius: 50%;
  background: rgb(255 255 255 / 0.5); box-shadow: inset 0 0 0 2px var(--line), 0 4px 14px rgb(0 0 0 / 0.08); touch-action: none; z-index: 2; }
.joy-knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 62%, #000); pointer-events: none; }
.joy.run .joy-knob { background: var(--pick); box-shadow: 0 3px 0 color-mix(in srgb, var(--pick) 60%, #000); }
.jump-btn { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 28px; width: 72px; height: 72px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 800 14px var(--font-display); touch-action: manipulation;
  box-shadow: 0 3px 0 var(--line); z-index: 2; cursor: pointer; }
.jump-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

/* maker board */
.maker { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-columns: 84px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.rail { grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 10px; padding: 16px 10px; background: var(--rail); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; }
.rail button { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 20px;
  padding: 11px 4px 9px; display: grid; justify-items: center; gap: 4px; font: 800 11px var(--font-display); cursor: pointer;
  box-shadow: 0 3px 0 var(--line); transition: transform 0.12s ease; }
.rail button svg { width: 30px; height: 30px; }
.rail button:hover { transform: translateY(-1px); }
.rail button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 62%, #000); }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; padding-block: 16px 12px; padding-left: 16px;
  padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.subtabs button { appearance: none; border: 1px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 999px;
  padding: 6px 13px; font: 800 13px var(--font-display); cursor: pointer; }
.subtabs button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { appearance: none; border: 1px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 999px;
  padding: 7px 14px; font: 800 13px var(--font-display); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.board { overflow-y: auto; padding-block: 16px 28px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group > h3 { margin: 0; font: 800 12px var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 12px 10px; }
.tile { appearance: none; border: 0; background: none; padding: 0; position: relative; cursor: pointer; color: var(--ink);
  display: grid; gap: 5px; text-align: center; font: 800 12px/1.2 var(--font-display); min-width: 0; }
.tile .pic { aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: var(--r-tile); overflow: hidden; display: grid; place-items: center;
  background: linear-gradient(var(--tile-top), var(--tile)); box-shadow: inset 0 0 0 1px var(--line); transition: transform 0.12s ease; }
.tile canvas, .tile img.thumb { width: 100%; height: 100%; display: block; object-fit: contain; }
.tile .glyph { width: 46%; height: 46%; color: var(--muted); }
.tile .swatch { width: 58%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 -6px 10px rgb(0 0 0 / 0.25), 0 2px 0 var(--line); }
.tile small { color: var(--muted); font: 600 11px/1.25 var(--font-body); }
.tile:hover .pic { transform: translateY(-2px); }
.tile:active .pic { transform: translateY(1px) scale(0.98); }
.tile:focus-visible { outline: none; }
.tile:focus-visible .pic { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile[aria-pressed="true"] .pic { box-shadow: inset 0 0 0 3px var(--pick); background: linear-gradient(var(--tile-top), var(--pick-soft)); }
.tile .check { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--pick);
  color: #fff; display: none; place-items: center; box-shadow: 0 2px 0 color-mix(in srgb, var(--pick) 60%, #000); }
.tile .check svg { width: 13px; height: 13px; }
.tile[aria-pressed="true"] .check { display: grid; }
.tile.flash .pic { box-shadow: inset 0 0 0 3px var(--accent); }
.tile:disabled { cursor: not-allowed; opacity: 0.55; }
.tile:disabled:hover .pic { transform: none; }
.note { font: 600 12.5px/1.45 var(--font-body); color: var(--muted); margin: 0; max-width: 60ch; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 150px) 36px; gap: 10px; align-items: center; font: 700 13px var(--font-display); }
.slider span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slider output { font: 800 11px var(--font-display); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--tile); padding: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 999px;
  padding: 7px 13px; font: 800 12.5px var(--font-display); cursor: pointer; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.rail button:focus-visible, .subtabs button:focus-visible, .btn:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px; }
details { border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font: 800 13px var(--font-display); padding: 4px 0; }
details .list { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: center; font: 700 13px var(--font-display); }
.keys > div { display: flex; gap: 4px; flex-wrap: wrap; }
.rules { font: 600 12.5px/1.5 var(--font-body); color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
.rules strong { color: var(--ink); font-weight: 800; }

.tiles.swatches { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
.tile .swatch.original { background: conic-gradient(from 200deg, #f3d6c4, #c58a5d, #4c2a18, #2f78e0, #14a7a0, #f3d6c4); }
.stepper { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.step-label { font: 800 13px var(--font-display); }
.step-name { grid-column: 1 / -1; justify-self: end; font: 700 12px var(--font-display); color: var(--muted); }
.step-ctl { display: flex; align-items: center; gap: 8px; }
.step-btn { appearance: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); font: 800 18px/1 var(--font-display); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.step-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.pips { display: flex; gap: 5px; }
.pip { appearance: none; width: 16px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: var(--tile); cursor: pointer; padding: 0; }
.pip[aria-pressed="true"] { background: var(--accent); border-color: transparent; }
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.pad { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pad-head { display: flex; justify-content: space-between; align-items: center; font: 800 13px var(--font-display); }
.btn.tiny { padding: 3px 9px; font-size: 11px; }
.text-btn { appearance: none; border: 0; background: none; padding: 2px 2px; color: var(--accent); font: 700 12px var(--font-display);
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.text-btn:hover { color: var(--ink); }
.text-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.board-head { display: flex; justify-content: flex-end; }
.pad-area { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 20px; background: radial-gradient(circle, var(--tile-top), var(--tile));
  box-shadow: inset 0 0 0 1px var(--line); touch-action: none; cursor: grab; overflow: hidden; }
.pad-area:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pad-x, .pad-y { position: absolute; background: var(--line); }
.pad-x { left: 8%; right: 8%; top: 50%; height: 2px; margin-top: -1px; }
.pad-y { top: 8%; bottom: 8%; left: 50%; width: 2px; margin-left: -1px; }
.pad-lab { position: absolute; font: 800 9.5px var(--font-display); color: var(--muted); pointer-events: none; white-space: nowrap; }
.pad-lab.up { top: 6px; left: 50%; transform: translateX(-50%); }
.pad-lab.down { bottom: 6px; left: 50%; transform: translateX(-50%); }
.pad-lab.left { left: 7px; top: 50%; transform: translateY(-140%); }
.pad-lab.right { right: 7px; top: 50%; transform: translateY(-140%); }
.knob { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--pick);
  box-shadow: 0 3px 0 color-mix(in srgb, var(--pick) 60%, #000), 0 0 0 4px color-mix(in srgb, var(--pick) 25%, transparent); pointer-events: none; }
details .list h4 { margin: 8px 0 0; font: 800 12px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 52%) minmax(0, 1fr); }
  .maker { border-left: 0; border-top: 1px solid var(--line); grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
  .rail { grid-row: auto; flex-direction: row; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  .rail button { flex: 1; grid-auto-flow: column; align-items: center; gap: 6px; padding: 7px 4px; }
  .rail button svg { width: 22px; height: 22px; }
  .subtabs, .board { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); }
  .logo { font-size: 24px; }
  .brand p { display: none; }
  #tags .tag:not(.warn) { display: none; }
}
@media (max-width: 420px) { .rail button span { display: none; } }
@media (prefers-reduced-motion: reduce) { .tile .pic, .rail button { transition: none; } }
</style>

<div class="app">
  <section class="stage" aria-label="Avatar preview">
    <canvas id="view"></canvas>
    <div class="loading" id="loading">Loading Xander…</div>
    <div class="stage-head">
      <div class="brand">
        <h1 class="logo"><b>AN</b>Maker</h1>
      </div>
    </div>
    <div class="stage-foot">
      <div class="drive-hint" aria-label="Keyboard controls"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>walk</span><kbd>Shift</kbd><span>run</span><kbd>Space</kbd><span>jump</span></div>
    </div>
    <div class="joy" id="joy" hidden role="application" aria-label="Move: drag to walk, push to the edge to run"><span class="joy-knob"></span></div>
    <button type="button" class="jump-btn" id="jump-btn" hidden>Jump</button>
  </section>

  <aside class="maker" aria-label="Maker">
    <nav class="rail" id="rail" role="tablist" aria-label="Categories"></nav>
    <div class="subtabs" id="subtabs" role="tablist" aria-label="Parts"></div>
    <div class="board" id="board" role="tabpanel"></div>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js",

} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { MeshBVH } from 'three-mesh-bvh';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';

const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  kids.flat().forEach((c) => e.append(c));
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('fit.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fit.' + k, JSON.stringify(v)); } catch {} },
};

// ---------- scene
const canvas = $('#view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.localClippingEnabled = true;          // head pictures clip the body away below the neck
// render at exactly twice the screen's pixels: a whole-number downscale stays sharp (1.5x blurred every edge)
const SUPERSAMPLE = 2;
// Phones and tablets (touch, no hover) get a lighter studio: at most 2x their screen's pixels (4x on a 2x phone was
// about 7 million samples a frame), one shadowed key light instead of four, a smaller shadow map, no ambient-occlusion
// pass, the floor's contact shadow redrawn every third frame, and no wardrobe preloading. Desktop is unchanged.
const LITE = matchMedia('(hover: none) and (pointer: coarse)').matches;
const pixelRatio = () => LITE ? Math.min(devicePixelRatio, 2) : Math.min(devicePixelRatio * SUPERSAMPLE, 4);
renderer.setPixelRatio(pixelRatio());
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.705;
// ACES with a raised white point, blended a fifth of the way toward Khronos PBR Neutral: plain ACES flattens the
// top quarter of the skin (the lit cheek, nose and chin stop near 235 in red); the concept keeps them bright and
// saturated up to about 250. Fitted against the concept's skin histogram.
THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment
  .replace('vec3 ACESFilmicToneMapping( vec3 color ) {', `vec3 NeutralTM( vec3 color ) {
	const float StartCompression = 0.8 - 0.04;
	const float Desaturation = 0.15;
	float x = min( color.r, min( color.g, color.b ) );
	float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;
	color -= offset;
	float peak = max( color.r, max( color.g, color.b ) );
	if ( peak < StartCompression ) return color;
	const float d = 1. - StartCompression;
	float newPeak = 1. - d * d / ( peak + d - StartCompression );
	color *= newPeak / peak;
	float g = 1. - 1. / ( Desaturation * ( peak - newPeak ) + 1. );
	return mix( color, vec3( newPeak ), g );
}
vec3 ACESFilmicToneMapping( vec3 color ) {
